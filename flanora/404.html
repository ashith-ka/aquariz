<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#061a0c" />
  <title>404 - Page Not Found | Flanora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #05150a;
      --bg-surface: #0a2313;
      --border-emerald: rgba(34, 197, 94, 0.2);
      --accent-green-bright: #22c55e;
      --accent-gold: #e6a742;
      --accent-gold-light: #fef08a;
      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --radius-md: 14px;
      --shadow-card: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: var(--bg-dark); }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container { max-width: 480px; text-align: center; }
    .error-code {
      font-family: var(--font-display);
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent-gold);
      margin-bottom: 1rem;
      text-shadow: 0 0 60px rgba(230, 167, 66, 0.3);
    }
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-emerald);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(34, 197, 94, 0.6); }
    .parent-link {
      margin-top: 2rem;
      padding: 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-emerald);
      border-radius: var(--radius-md);
    }
    .parent-link p { color: var(--text-muted); margin-bottom: 0.75rem; font-size: 0.95rem; }
    .parent-link a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-gold);
      font-weight: 700;
    }
    .parent-link a:hover { color: #fff; }
    @media (max-width: 480px) {
      .error-code { font-size: 5rem; }
      .error-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you're looking for doesn't exist or has been moved. 
      It might be a temporary issue or the URL was entered incorrectly.
    </p>
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Back to Flanora Home
      </a>
      <a href="../index.html" class="btn btn-secondary">
        <i class="fa-solid fa-building"></i> Aquariz Parent Hub
      </a>
    </div>
    <div class="parent-link">
      <p>Return to the parent enterprise portal</p>
      <a href="../index.html">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Aquariz Corporate Site
      </a>
    </div>
  </div>
</body>
</html>
